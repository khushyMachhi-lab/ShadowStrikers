version: '3.8'
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: register_student_db
      MYSQL_ROOT_PASSWORD: Khushy0611
    ports:
      - "3307:3306"

  app:
    build: .
    ports:
      - "8088:8088"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/register_student_db?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Khushy0611